<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-page="Product">alwazir</title>
  <link rel="icon" type="image/png" href="/img/seed/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand">
        <img class="brand-logo hidden" data-logo alt="logo">
        <span class="brand-name gold-text" data-brand>alwazir</span>
      </a>
      <div class="header-actions">
        <a href="/" class="admin-link">Home</a>
        <button class="cart-btn" data-cart-open aria-label="Open cart">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          Cart
          <span class="cart-count" data-cart-count>0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="details-page container">
    <div class="breadcrumb"><a href="/">Home</a> &nbsp;/&nbsp; <span data-breadcrumb>Product</span></div>

    <section data-product-notfound class="empty-state hidden">
      <div class="big">&#128148;</div>
      <h3>Product not found</h3>
      <p>This fragrance may have been removed.</p>
      <a class="btn btn-gold" href="/" style="margin-top:16px">Back to Home</a>
    </section>

    <section data-product-layout class="details-layout">
      <div class="details-media" data-details-media></div>
      <div class="details-info">
        <div class="details-badges" data-details-badges></div>
        <div class="product-category" data-details-category></div>
        <h1 data-details-name></h1>
        <div class="details-price" data-details-price></div>
        <p class="details-desc" data-details-desc></p>
        <div class="details-actions">
          <button class="btn btn-gold" data-action="add" data-details-add>Add to Cart</button>
          <button class="btn btn-outline" data-back-home>Back to Home</button>
        </div>
      </div>
    </section>

    <section class="similar-section">
      <h2 class="section-title gold-text">You May Also Like</h2>
      <p class="section-sub">Explore more from the Alwazir collection</p>
      <div class="similar-grid" data-similar-grid></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="brand-name gold-text" data-brand>alwazir</div>
      <p>&copy; <span data-year></span> <span data-brand>alwazir</span> — Luxury Perfume Oils. All rights reserved.</p>
    </div>
  </footer>

  <div class="overlay" data-cart-overlay></div>
  <aside class="cart-drawer" data-cart-drawer aria-label="Shopping cart">
    <div class="cart-head">
      <h3>Your Cart</h3>
      <button class="close-btn" data-cart-close aria-label="Close cart">&times;</button>
    </div>
    <div class="cart-items" data-cart-items></div>
    <div class="cart-foot">
      <div class="cart-total-row">Total <span class="amount" data-cart-total></span></div>
      <form class="checkout-form" data-checkout-form>
        <input type="text" name="name" placeholder="Your name" required>
        <input type="tel" name="phone" placeholder="Phone number" required>
        <button type="submit" class="btn btn-gold btn-block">Place Order</button>
      </form>
      <button class="btn btn-outline btn-block" data-cart-clear>Clear Cart</button>
    </div>
  </aside>

  <script src="/js/app.js"></script>
  <script src="/js/product.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
